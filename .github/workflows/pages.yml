name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate website
        run: npm run build
        
      - name: Check generated files
        run: |
             echo "===== Search generated HTML files ====="
             find public -type f -name "index.html" | sort

             echo "===== Search for dengbao article ====="
             find public -type f | grep -E "2026/10|dengbao|等保" || true

             echo "===== Search article title in generated files ====="
             grep -R -l "等保2.0的理解" public || true        

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
